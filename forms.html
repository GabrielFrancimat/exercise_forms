<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/styles/style-forms.css" />
    <title>Document</title>
  </head>
  <body>
    <div id="face-form">
      <h1>Entrar no Facebook</h1>
      <form action="" method="post">
        <div id="login-form">
          <div id="inputs-container">
            <input
              type="text"
              placeholder="Email ou número de celular"
              required
            />
            <input type="password" placeholder="Senha" required />
          </div>

          <button class="btns-geral" id="btn-form">Entrar</button>
          <button class="btns-geral" id="btn-passwd">Esqueceu a senha?</button>
        </div>
      </form>

      <button class="btns-geral" id="btn-newAcc">Criar nova conta</button>

      <img id="img-logo" src="/assets/img/Meta-Logo.png" alt="ícone da Meta" />
    </div>
  </body>
</html>
